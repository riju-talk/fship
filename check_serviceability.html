<!DOCTYPE html>
<html>
<head>
  <title>Pincode Serviceability Checker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 430px;
      margin: auto;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background: #007BFF;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
    #results { margin-top: 15px; }
    .courier {
      padding: 8px;
      margin: 5px 0;
      background: #e8f4fd;
      border-left: 4px solid #007BFF;
    }
  </style>
</head>
<body>
<div class="card">
  <h2>Check Delivery Area</h2>
  <input type="text" id="pickup" placeholder="Pickup Pincode (e.g., 560001)">
  <input type="text" id="destination" placeholder="Destination Pincode (e.g., 110001)">
  <button onclick="checkServiceability()">Check Now</button>
  <div id="results"></div>
</div>

<script>
async function checkServiceability() {
  const pickup = document.getElementById("pickup").value.trim();
  const dest = document.getElementById("destination").value.trim();
  const resultsDiv = document.getElementById("results");

  if (!pickup || !dest) {
    resultsDiv.innerHTML = "<p style='color:red;'>Please enter both pincodes.</p>";
    return;
  }

  resultsDiv.innerHTML = "<p>Checking... </p>";

  try {
    const res = await fetch(`/api/check-serviceability?pickup_pincode=${encodeURIComponent(pickup)}&destination_pincode=${encodeURIComponent(dest)}&user_id=demo_user`, {
      method: "POST"
    });
    const data = await res.json();

    const couriers = data.serviceable_couriers || [];
    if (couriers.length === 0) {
      resultsDiv.innerHTML = "<p>No couriers service this area.</p>";
      return;
    }

    let html = "<h3>Serviceable Couriers:</h3>";
    couriers.forEach(c => {
      html += `<div class='courier'><strong>${c.name}</strong> (${c.aggregator})<br>ETA: ${c.eta} | Type: ${c.type}</div>`;
    });
    resultsDiv.innerHTML = html;
  } catch (err) {
    resultsDiv.innerHTML = "<p style='color:red;'>Failed to check. Try again.</p>";
  }
}
</script>
</body>
</html>
